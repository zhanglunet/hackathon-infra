# example-mock.ini — 用假服务演示夜跑队列的写法，本机就能跑，不用 GPU、$0。
#
#   python3 nightq/nightq.py nightq/example-mock.ini --dry-run
#   python3 nightq/nightq.py nightq/example-mock.ini --out nightq/runs/demo
#   cat nightq/runs/demo/summary.md
#
# 写法规则：
#   - 每个 [小节] 是一个任务，按文件里的顺序跑；小节名会当目录名。
#   - [DEFAULT] 里写的，每个任务都继承；任务里再写同名的键就覆盖（env 是合并）。
#   - steps / env / snapshot 可以写多行：换行后缩进，一行一条。
#   - 注释必须独占一行（# 开头）。不要在命令后面跟 # 注释，会被当成命令的一部分。
#   - 命令里可以用 $NIGHTQ_OUT（本任务的结果目录）和 $NIGHTQ_JOB（任务名）。

[DEFAULT]
ready_url = http://127.0.0.1:18770/health
ready_timeout = 60
ready_interval = 1
step_timeout = 600
settle = 1
snapshot =
    curl -s http://127.0.0.1:18770/v1/models

# 任务 1：假服务按「快」的参数起，跑一档压测
[mock-fast]
start = python3 loadtest/mock_server.py --port 18770 --speedup 10 --prefill-tps 40000 --tpot-ms 15
steps =
    python3 loadtest/make_datasets.py --out $NIGHTQ_OUT/data --scale 0.02 --concurrency 8 --scenarios longgen,stress
    python3 loadtest/run_ladder.py --url http://127.0.0.1:18770 --data $NIGHTQ_OUT/data --out $NIGHTQ_OUT/ladder --engine builtin --concurrency 8 --scenarios longgen,stress --label "$NIGHTQ_JOB"

# 任务 2：换一组参数（模拟换了部署配置），同样的步骤
[mock-slow]
start = python3 loadtest/mock_server.py --port 18770 --speedup 10 --prefill-tps 8000 --tpot-ms 60
steps =
    python3 loadtest/make_datasets.py --out $NIGHTQ_OUT/data --scale 0.02 --concurrency 8 --scenarios longgen,stress
    python3 loadtest/run_ladder.py --url http://127.0.0.1:18770 --data $NIGHTQ_OUT/data --out $NIGHTQ_OUT/ladder --engine builtin --concurrency 8 --scenarios longgen,stress --label "$NIGHTQ_JOB"

# 任务 3：故意写一个起不来的服务，看队列会不会卡住（不会：记下原因，接着跑下一个）
[broken-start]
start = echo "模拟：启动参数写错了"; exit 3

# 任务 4：不需要服务的任务（比如 MoE 调优表生成），只写 steps
[no-server]
steps =
    echo "这里可以放 scripts/tune_moe_sm120.sh 之类不需要推理服务的长任务"
