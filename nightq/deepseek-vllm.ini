# deepseek-vllm.ini — DeepSeek-V4.1-Flash 单机（8 卡）vLLM 配置对照的夜跑队列模板。
#
# 状态：模板。里面的开关全部取自 serve-deepseek.sh 文件头列出的环境变量，
#       只过了 --dry-run 和假服务串联，**没有在真机上跑过**。
#
# 上机后先做三件事：
#   1. 把下面 MODEL_DIR 改成现场 NFS 上的权重目录（和白天 serve-deepseek.sh 用的一样）。
#   2. 把不想跑的任务删掉或加一行 enabled = false；按重要程度排好顺序（一个任务可能要一两个小时）。
#   3. python3 nightq/nightq.py nightq/deepseek-vllm.ini --dry-run 核对一遍，再挂后台：
#      nohup python3 nightq/nightq.py nightq/deepseek-vllm.ini --out nightq/runs/$(date +%m%d)-ds --stop-after 08:30 &
#
# 写法：每个任务只写和基线不一样的环境变量，起服务命令和步骤都继承 [DEFAULT]。
# 走 docker 的话见 nightq/README.md「用 docker 起服务」一节（start / stop 要改）。

[DEFAULT]
start = bash serve-deepseek.sh
ready_url = http://127.0.0.1:8000/health
# serve-deepseek.sh 里 VLLM_ENGINE_READY_TIMEOUT_S 是 3600，这里多留 5 分钟
ready_timeout = 3900
step_timeout = 14400
env =
    MODEL_DIR=/data/models
    LOG_DIR=$NIGHTQ_OUT/logs
snapshot =
    nvidia-smi
    curl -s http://127.0.0.1:8000/v1/models
steps =
    BASE_URL=http://127.0.0.1:8000 MODEL=deepseek-v4.1-flash bash smoke-test.sh
    python3 loadtest/run_ladder.py --url http://127.0.0.1:8000 --data loadtest/data --out $NIGHTQ_OUT/ladder --engine builtin --label "$NIGHTQ_JOB"

# 压测数据只生成一次（全量约 500 MB）；已经有了就跳过。这个任务不需要服务，所以 start 留空。
[prep-data]
start =
steps =
    test -f loadtest/data/meta.json || python3 loadtest/make_datasets.py --out loadtest/data

# 基线：8 卡 TP + Engram 放主机内存（serve-deepseek.sh 的默认值）
[ds-tp8-baseline]

# Engram 放显存（每卡约 59.5 GiB 权重，serve-deepseek.sh 关键核实项 3）
[ds-engram-on-gpu]
env =
    ENGRAM_CPU_OFFLOAD=false

# DEP8：数据并行 + 专家并行
[ds-dep8]
env =
    TP_SIZE=1
    DP_SIZE=8
    ENABLE_EP=1

# KV 缓存不量化，用来对照 fp8 KV 的精度和容量
[ds-kv-auto]
env =
    KV_CACHE_DTYPE=auto

# 调大每步 prefill 的 token 上限
[ds-batched-16k]
env =
    MAX_NUM_BATCHED_TOKENS=16384

# DSpark 推测解码（开了必须重跑精度）
[ds-dspark5]
env =
    DSPARK_TOKENS=5
